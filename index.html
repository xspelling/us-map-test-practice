<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>US Map Test Practice</title>
<style>
:root{
  --ink:#1f2a37; --muted:#5b6b7f; --line:#c9d4e0;
  --blue:#2f6fed; --blue-dk:#1b4fb5; --blue-lt:#d9e7fd;
  --green:#1f9d55; --green-lt:#d8f2e3;
  --red:#d63b3b; --red-lt:#fbdede;
  --gray:#d5dae1; --bg:#eef2f7; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
  color:var(--ink); background:var(--bg); font-size:17px; line-height:1.4;
  -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit;font-size:inherit}
h1,h2,h3{margin:0}
header{
  position:sticky; top:0; z-index:40; background:#fff; border-bottom:2px solid var(--line);
  padding:8px 14px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
  box-shadow:0 1px 4px rgba(20,40,70,.07);
}
.brand h1{font-size:23px; letter-spacing:.2px}
.brand .sub{font-size:13px; color:var(--muted); margin-top:1px}
.tabs{display:flex; gap:6px; margin-left:auto}
.tab{
  border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:var(--radius);
  padding:9px 18px; font-size:16px; font-weight:600; cursor:pointer; min-height:44px;
}
.tab:hover{border-color:#9fb4cc}
.tab.active{background:var(--blue); border-color:var(--blue-dk); color:#fff}
.hud{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.chip{
  background:#eef3f9; border:1px solid var(--line); border-radius:999px;
  padding:5px 13px; font-size:14px; font-weight:600; white-space:nowrap;
}
.chip b{color:var(--blue-dk)}
main{
  display:grid; grid-template-columns:minmax(0,1fr) 350px; gap:14px;
  padding:14px; align-items:start; max-width:1500px; margin:0 auto;
}
.mapcol{min-width:0}
.mapwrap{position:relative; background:#fff; border:2px solid var(--line); border-radius:14px; padding:6px}
svg#map{display:block; width:100%; height:auto; background:#fff; touch-action:none; user-select:none; -webkit-user-select:none; cursor:crosshair}
#states path{fill:#eef3f9; stroke:#8496aa; stroke-width:.7; stroke-linejoin:round}
#states path.hl{fill:#cfe0f7}
#states path.done{fill:var(--gray); stroke:#98a3b0}
#states path.target{fill:var(--blue); stroke:var(--blue-dk); stroke-width:1.2}
#states path.ok{fill:#5cc98d; stroke:#1f7a4d; stroke-width:1.2}
#states path.bad{fill:#f08a8a; stroke:#b02a2a; stroke-width:1.2}
#states path.pick{stroke:#123a72; stroke-width:1.8}
#labels, #capDots, #userDots{pointer-events:none}
#labels text, #capDots text{
  font-family:inherit; font-size:11px; fill:var(--ink); text-anchor:middle;
  paint-order:stroke; stroke:#fff; stroke-width:2.6px; stroke-linejoin:round;
}
#labels text.abbr{font-size:10.5px; font-weight:800; letter-spacing:.4px}
#labels text.full{font-size:10px}
#capDots text.cap{font-size:9.5px; fill:var(--blue-dk)}
.leader{stroke:#8496aa; stroke-width:.6; fill:none}
.capdot{fill:var(--blue-dk); stroke:#fff; stroke-width:1.4}
.usdot{fill:#7c3aed; stroke:#fff; stroke-width:1.4}
.usdot.ok{fill:var(--green)}
.usdot.bad{fill:var(--red)}
.zoombar{position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:6px; align-items:stretch}
.zoombar button{
  background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:6px 9px;
  font-size:13px; font-weight:600; cursor:pointer; min-width:52px; box-shadow:0 1px 2px rgba(20,40,70,.12);
}
.zoombar button:hover{background:#f2f7ff; border-color:#9fb4cc}
.zoombar button.on{background:var(--blue); border-color:var(--blue-dk); color:#fff}
.zoombar .wide{min-width:76px}
.lens{
  position:absolute; right:12px; bottom:12px; width:250px; height:190px;
  background:#fff; border:2px solid var(--blue-dk); border-radius:12px; overflow:hidden;
  box-shadow:0 6px 18px rgba(20,40,70,.22);
}
.lens svg{display:block; width:100%; height:100%; cursor:crosshair}
.lens .cap{
  position:absolute; top:0; left:0; right:0; background:rgba(31,42,55,.85); color:#fff;
  font-size:11px; font-weight:600; padding:2px 7px; letter-spacing:.3px;
}
.lens .cross{stroke:var(--red); stroke-width:1.2}
.tip{
  position:absolute; z-index:20; background:#1f2a37; color:#fff; border-radius:8px;
  padding:7px 11px; font-size:14px; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.25);
  transform:translate(-50%,-135%); white-space:nowrap;
}
.tip .c{color:#a9d3ff; font-weight:600; display:block; font-size:13px}
.mapfoot{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:9px; font-size:13.5px; color:var(--muted)}
.legend{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.legend span{display:flex; gap:5px; align-items:center}
.legend i{width:14px; height:11px; border-radius:3px; display:inline-block; border:1px solid #7b8ca0}
.panel{background:#fff; border:2px solid var(--line); border-radius:14px; padding:14px}
.panel h2{font-size:20px; margin-bottom:8px}
.panel h3{font-size:16px; margin:13px 0 6px}
.hint{font-size:13.5px; color:var(--muted); margin:8px 0 0}
.meta{font-size:15px; margin:6px 0 10px; color:var(--muted)}
.meta b{color:var(--ink)}
.fld{display:block; margin:10px 0}
.fld span{display:block; font-size:14px; font-weight:700; margin-bottom:4px}
input[type=text]{
  width:100%; padding:11px 12px; border:2px solid var(--line); border-radius:10px;
  background:#fbfdff; font-size:17px;
}
input[type=text]:focus{outline:none; border-color:var(--blue); background:#fff}
input[type=text].ok{border-color:var(--green); background:var(--green-lt)}
input[type=text].bad{border-color:var(--red); background:var(--red-lt)}
.btns{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
button.primary{
  background:var(--blue); color:#fff; border:2px solid var(--blue-dk); font-weight:700;
  border-radius:10px; padding:11px 18px; cursor:pointer; min-height:44px;
}
button.primary:hover{background:var(--blue-dk)}
button.ghost{
  background:#fff; color:var(--ink); border:2px solid var(--line); font-weight:600;
  border-radius:10px; padding:11px 16px; cursor:pointer; min-height:44px;
}
button.ghost:hover{background:#f2f7ff; border-color:#9fb4cc}
button.ghost.on{background:var(--blue-lt); border-color:var(--blue)}
button.ghost[disabled]{opacity:.45; cursor:default}
label.check{display:flex; gap:8px; align-items:center; font-size:15px; margin:8px 0}
.prompt{background:var(--blue-lt); border:2px dashed #6f9de8; border-radius:10px; padding:9px 11px; font-weight:600; margin:10px 0}
.fb{border-radius:9px; padding:8px 11px; margin:7px 0; font-size:15px; border:2px solid transparent}
.fb.ok{background:var(--green-lt); border-color:#9ad4b4; color:#14663a}
.fb.bad{background:var(--red-lt); border-color:#eba6a6; color:#97201f}
.fb b{text-transform:uppercase; font-size:12.5px; letter-spacing:.6px; display:block; opacity:.85}
.fb .you{font-size:14px}
.fb em{font-style:normal; font-weight:700}
.card{border:2px solid var(--line); border-radius:12px; padding:11px; margin-top:12px; background:#fbfdff}
.card .cardhead{font-size:14px; font-weight:700; margin-bottom:6px; color:var(--muted)}
.cards{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.pill{
  border:2px solid var(--line); background:#fff; border-radius:999px; font-size:12.5px; font-weight:700;
  padding:5px 9px; cursor:pointer; min-width:40px; text-align:center;
}
.pill.done{background:var(--gray); border-color:#98a3b0}
.pill.open{background:var(--blue); border-color:var(--blue-dk); color:#fff}
.scores{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0}
.scorebox{border:2px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; background:#fbfdff}
.scorebox .n{font-size:30px; font-weight:800; line-height:1.05}
.scorebox .l{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px}
.scorebox.ok .n{color:var(--green)}
.scorebox.bad .n{color:var(--red)}
.miss{border:2px solid var(--line); border-radius:10px; padding:9px 11px; margin:8px 0; background:#fbfdff}
.miss .ab{font-weight:800; color:var(--blue-dk)}
.miss .q{font-size:14.5px; margin-top:3px}
.miss .q s{color:#97201f}
.miss .q em{color:#14663a; font-style:normal; font-weight:700}
.hide{display:none !important}
footer{padding:2px 16px 22px; color:var(--muted); font-size:13px; text-align:center}
footer button{background:none; border:none; color:var(--blue-dk); text-decoration:underline; cursor:pointer; font-size:13px; padding:6px}
.modal{position:fixed; inset:0; background:rgba(15,25,40,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px}
.modal .box{background:#fff; border-radius:14px; padding:18px; max-width:420px; width:100%}
.modal h3{font-size:19px; margin-bottom:8px}
.modal p{margin:0 0 14px}
@media (max-width:980px){
  main{grid-template-columns:minmax(0,1fr)}
  .brand h1{font-size:20px}
  .tabs{margin-left:0; width:100%; order:3}
  .tab{flex:1; padding:10px 6px}
  .hud{order:2; margin-left:auto}
  .lens{width:180px; height:138px}
  .zoombar{top:8px; right:8px}
  .zoombar button{min-width:46px; font-size:12.5px; padding:6px 7px}
}
</style>
</head>
<body>

  <div class="brand">

    <span class="chip" id="chipScore"></span>

</header>

function norm(v){

    .replace(/[\u2018\u2019']/g,"")

function matchAns(input,base,alts){

let vb={x:0,y:0,w:MAP_W,h:MAP_H};
function applyVB(){ svg.setAttribute("viewBox",vb.x.toFixed(2)+" "+vb.y.toFixed(2)+" "+vb.w.toFixed(2)+" "+vb.h.toFixed(2)); }
let vbFrom=null, vbTo=null, vbT0=0, vbDur=380;
function tweenTo(t){
  vbFrom={x:vb.x,y:vb.y,w:vb.w,h:vb.h}; vbTo=t; vbT0=performance.now(); requestAnimationFrame(tweenStep);
}
function tweenStep(){
  if(!vbTo) return;
  let k=(performance.now()-vbT0)/vbDur;
  if(k>=1) k=1;
  const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  vb={x:vbFrom.x+(vbTo.x-vbFrom.x)*e,y:vbFrom.y+(vbTo.y-vbFrom.y)*e,
      w:vbFrom.w+(vbTo.w-vbFrom.w)*e,h:vbFrom.h+(vbTo.h-vbFrom.h)*e};
  applyVB();
  if(k===1) vbTo=null; else requestAnimationFrame(tweenStep);
}
function zoomAt(cx,cy,f){
  const nw=Math.min(MAP_W*1.02,Math.max(26,vb.w*f));
  const nh=nw*vb.h/vb.w;
  vb.x=cx-(cx-vb.x)*(nw/vb.w);
  vb.y=cy-(cy-vb.y)*(nh/vb.h);
  vb.w=nw; vb.h=nh;
  applyVB();
}
function svgPoint(e){
  const m=svg.getScreenCTM();
  if(!m) return {x:0,y:0};
  const p=svg.createSVGPoint();
  p.x=e.clientX; p.y=e.clientY;
  return p.matrixTransform(m.inverse());
}
const samples={};
function stateSamples(ab){
  if(samples[ab]) return samples[ab];
  const el=els[ab], out=[];
  let len=0;
  try{ len=el.getTotalLength(); }catch(e){ len=0; }
  const step=Math.max(2.5,len/280);
  for(let d=0; d<len; d+=step){ const p=el.getPointAtLength(d); out.push(p.x,p.y); }
  if(len>0){ const p=el.getPointAtLength(len); out.push(p.x,p.y); }
  samples[ab]=out;
  return out;
}
function nearestState(x,y,maxd){
  let best=null, bd=maxd*maxd;
  for(let i=0;i<order.length;i++){
    const ab=order[i], el=els[ab];
    let bb=null;
    try{ bb=el.getBBox(); }catch(e){ continue; }
    const cx=Math.min(Math.max(x,bb.x),bb.x+bb.width);
    const cy=Math.min(Math.max(y,bb.y),bb.y+bb.height);
    if((cx-x)*(cx-x)+(cy-y)*(cy-y)>bd) continue;
    const s=stateSamples(ab);
    for(let k=0;k<s.length;k+=2){
      const dx=s[k]-x, dy=s[k+1]-y, d2=dx*dx+dy*dy;
      if(d2<bd){ bd=d2; best=ab; }
    }
  }
  return best;
}
function stateAtPoint(x,y){
  for(let i=0;i<order.length;i++){
    const el=els[order[i]];
    try{ if(el.isPointInFill(new DOMPoint(x,y))) return order[i]; }catch(e){}
  }
  return nearestState(x,y,SNAP);
}
function abFromEvent(e){
  let n=e.target;
  while(n&&n!==svg){
    if(n.tagName==="path"&&n.getAttribute&&n.getAttribute("data-ab")) return n.getAttribute("data-ab");
    n=n.parentNode;
  }
  return null;
}

function labelGap(area){
  if(area>4000) return 0;
  if(area>1500) return 3;
  if(area>600) return 7;
  if(area>200) return 12;
  return 17;
}
const DIRS=[[0,0],[1.3,0],[-1.3,0],[0,-1.15],[0,1.15],[1.7,-1.2],[-1.7,-1.2],[1.7,1.2],[-1.7,1.2],[2.4,0],[-2.4,0],[0,-1.8],[0,1.8]];
function placeLabels(items){
  const placed=[];
  items.sort(function(a,b){ return (b.area||0)-(a.area||0); });
  items.forEach(function(it){
    const gap=labelGap(it.area);
    const need=gap>0?13:15;
    let chosen=null;
    for(let i=0;i<DIRS.length;i++){
      const nx=it.x+DIRS[i][0]*gap, ny=it.y+DIRS[i][1]*gap;
      let free=true;
      for(let j=0;j<placed.length;j++){
        const dx=placed[j].x-nx, dy=placed[j].y-ny;
        if(Math.sqrt(dx*dx+dy*dy)<need){ free=false; break; }
      }
      if(free){ chosen={x:nx,y:ny}; break; }
    }
    if(!chosen) chosen={x:it.x,y:it.y};
    chosen.x=Math.max(10,Math.min(MAP_W-10,chosen.x));
    chosen.y=Math.max(14,Math.min(MAP_H-6,chosen.y));
    placed.push(chosen);
    if(gap>0){
      const l=document.createElementNS(SVGNS,"line");
      l.setAttribute("x1",it.x.toFixed(1)); l.setAttribute("y1",it.y.toFixed(1));
      l.setAttribute("x2",chosen.x.toFixed(1)); l.setAttribute("y2",chosen.y.toFixed(1));
      l.setAttribute("class","leader");
      it.group.appendChild(l);
    }
    const t=document.createElementNS(SVGNS,"text");
    t.setAttribute("x",chosen.x.toFixed(1));
    t.setAttribute("y",(chosen.y+(gap>0?3.5:4)).toFixed(1));
    t.setAttribute("class",it.cls);
    t.textContent=it.text;
    it.group.appendChild(t);
  });
}

  if(!c||!test) return;
  const a=test.ans[ab];
  c.innerHTML='<div class="card">'+
    '<div class="cardhead">Answer for this state</div>'+
    '<label class="fld"><span>State</span><input type="text" id="sState" autocomplete="off" autocapitalize="words" spellcheck="false" value="'+esc(a.state)+'"></label>'+
    '<label class="fld"><span>Capital</span><input type="text" id="sCap" autocomplete="off" autocapitalize="words" spellcheck="false" value="'+esc(a.cap)+'"></label>'+
    '<div class="meta">Capital mark: <b>'+(a.dot?"placed on the map":"not placed yet")+'</b></div>'+
    '<div class="btns">'+
      '<button class="primary" id="sSave">Save answer</button>'+
      '<button class="ghost" id="sDot">'+(a.dot?"Move capital mark":"Mark capital on map")+'</button>'+
      '<button class="ghost" id="sErase">Erase mark</button>'+
    '</div></div>';
  const sIn=$("#sState"), cIn=$("#sCap");
  sIn.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); cIn.focus(); } };
  cIn.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); saveAnswer(); } };
  $("#sSave").onclick=saveAnswer;
  $("#sDot").onclick=function(){
    test.armed=!test.armed;
    this.textContent=test.armed?"Now tap the map...":(a.dot?"Move capital mark":"Mark capital on map");
    svg.style.cursor=test.armed?"copy":"crosshair";
  };
  $("#sErase").onclick=function(){
    a.dot=null; redrawDots(); openCard(ab); buildPills();
  };
}
function saveAnswer(){
  const ab=test.sel;
  if(!ab) return;
  const a=test.ans[ab];
  const sIn=$("#sState"), cIn=$("#sCap");
  if(!sIn) return;
  a.state=sIn.value; a.cap=cIn.value;
  a.done=!!(a.state.trim()||a.cap.trim()||a.dot);
  const others=cls[ab]?cls[ab].split(" ").filter(function(x){ return x&&x!=="pick"; }):[];
  cls[ab]=(a.done?["done"]:[]).concat(others).join(" ");
  paint(); buildPills(); testMeta(); openCard(ab); updateHud();
}
function redrawDots(){
  clearGroup(gUsers);
  if(!test) return;
  test.pool.forEach(function(ab){
    const a=test.ans[ab];
    if(a&&a.dot) gUsers.appendChild(dot(a.dot.x,a.dot.y,"usdot",3.4));
  });
}
function submitTest(){
  const left=test.pool.length-answered();
  const go=function(){ stopTimer(); test.submitted=true; showResults(); };
  if(left>0){
    confirmBox("Submit anyway?",left+" state"+(left===1?" is":"s are")+" not finished yet.",function(ok){ if(ok) go(); });
  } else go();
}
function gradeTest(){
  const res={states:0,caps:0,locs:0,missed:[],rows:[]};
  test.pool.forEach(function(ab){
    const s=byAbbr[ab], a=test.ans[ab]||{state:"",cap:"",dot:null};
    const st=stateOK(a.state,s), cp=capitalOK(a.cap,s);
    let lo=false, dist=null;
    if(a.dot){
      dist=Math.sqrt(Math.pow(a.dot.x-s.capitalX,2)+Math.pow(a.dot.y-s.capitalY,2));
      lo=(stateAtPoint(a.dot.x,a.dot.y)===ab)&&dist<=TOL;
    }
    if(st) res.states++;
    if(cp) res.caps++;
    if(lo) res.locs++;
    if(!(st&&cp&&lo)) res.missed.push(ab);
    res.rows.push({ab:ab,st:st,cp:cp,lo:lo,a:a,s:s,dist:dist});
  });
  return res;
}
function showResults(){
  const res=gradeTest(), total=test.pool.length;
  prog.tests++;
  const score=res.states+res.caps+res.locs;
  const pct=Math.round(100*score/(total*3));
  if(pct>prog.bestScore) prog.bestScore=pct;
  res.rows.forEach(function(r){ markMissed(r.ab,!(r.st&&r.cp&&r.lo)); });
  save();
  cls={};
  res.rows.forEach(function(r){ cls[r.ab]=(r.st&&r.cp&&r.lo)?"done":"bad"; });
  paint();
  clearGroup(gUsers);
  res.rows.forEach(function(r){
    if(r.a.dot) gUsers.appendChild(dot(r.a.dot.x,r.a.dot.y,r.lo?"usdot ok":"usdot bad",3.4));
  });
  $("#chipTimer").classList.add("hide");
  let rows="";
  res.rows.forEach(function(r){
    if(r.st&&r.cp&&r.lo) return;
    rows+='<div class="miss"><span class="ab">'+esc(r.s.name)+' ('+r.ab+')</span>';
    rows+='<div class="q">State: '+(r.st?'<em>right</em>':'you typed <s>'+esc(r.a.state||"nothing")+'</s>, correct <em>'+esc(r.s.name)+'</em>')+'</div>';
    rows+='<div class="q">Capital: '+(r.cp?'<em>right</em>':'you typed <s>'+esc(r.a.cap||"nothing")+'</s>, correct <em>'+esc(r.s.capital)+'</em>')+'</div>';
    rows+='<div class="q">Capital location: '+(r.lo?'<em>right</em>':
      (r.dist===null?'you did not mark it, correct spot is <em>'+esc(r.s.capital)+'</em>'
        :'you marked it about '+Math.round(r.dist*MILES_PER_UNIT)+' miles off, correct spot is <em>'+esc(r.s.capital)+'</em>'))+'</div></div>';
  });
  const box=function(got,label){
    return '<div class="scorebox '+(got===total?"ok":"bad")+'"><div class="n">'+got+
      '</div><div class="l">'+label+' of '+total+'</div></div>';
  };
  $("#panel").innerHTML=
    '<h2>Results</h2>'+
    '<div class="meta">'+pct+'% overall &middot; best score '+prog.bestScore+'% &middot; tests taken '+prog.tests+'</div>'+
    '<div class="scores">'+box(res.states,"States")+box(res.caps,"Capitals")+box(res.locs,"Locations")+'</div>'+
    '<h3>'+(res.missed.length?res.missed.length+" state"+(res.missed.length===1?"":"s")+" to review":"Nothing to review")+'</h3>'+
    rows+
    '<div class="btns">'+
      (res.missed.length?'<button class="primary" id="rRetake">Retake missed only</button>':'')+
      '<button class="ghost" id="rAll">New test: all 50</button>'+
      '<button class="ghost" id="rPrac">Practice my missed</button>'+
    '</div>';
  if($("#rRetake")) $("#rRetake").onclick=function(){ startMode("test",res.missed.slice()); };
  $("#rAll").onclick=function(){ startMode("test"); };
  $("#rPrac").onclick=function(){ prog.practice.missedOnly=true; save(); startMode("practice"); };
  updateHud();
}

/* ---- tabs, hud, modal ---- */
function updateHud(){
  if(mode==="practice"&&pr){
    $("#chipScore").innerHTML="Score <b>"+pr.parts+"</b>/"+pr.total;
    $("#chipStreak").innerHTML="Streak <b>"+pr.streak+"</b>";
  } else if(mode==="test"&&test&&!test.submitted){
    $("#chipScore").innerHTML="Answered <b>"+answered()+"</b>/"+test.pool.length;
    $("#chipStreak").innerHTML="Best streak <b>"+prog.bestStreak+"</b>";
  } else {
    $("#chipScore").innerHTML="Missed <b>"+prog.missed.length+"</b>";
    $("#chipStreak").innerHTML="Best streak <b>"+prog.bestStreak+"</b>";
  }
}
const DESCS={
  study:"Hover or tap a state to see its name, capital, and capital location.",
  practice:"One state at a time: name it, name the capital, then place the capital.",
  test:"The whole map, like the real test. The timer runs while you work."
};
function startMode(m,arg){
  stopTimer();
  mode=m;
  test=null; pr=null;
  cls={}; paint(); hideAll(); clearGroup(gUsers);
  svg.style.cursor="crosshair";
  $$("#tabs .tab").forEach(function(t){ t.classList.toggle("active",t.dataset.mode===m); });
  $("#modeDesc").textContent=DESCS[m];
  $("#chipTimer").classList.add("hide");
  if(m==="study") panelStudy();
  else if(m==="practice") newPractice();
  else newTest(arg);
  updateHud();
}
function leavingTest(){ return mode==="test"&&test&&!test.submitted; }
function confirmBox(title,msg,cb){
  $("#mTitle").textContent=title;
  $("#mMsg").textContent=msg;
  $("#modal").classList.remove("hide");
  $("#mOk").onclick=function(){ $("#modal").classList.add("hide"); cb(true); };
  $("#mNo").onclick=function(){ $("#modal").classList.add("hide"); cb(false); };
}
$$("#tabs .tab").forEach(function(t){
  t.onclick=function(){
    const m=t.dataset.mode;
    if(m===mode) return;
    if(leavingTest()){
      confirmBox("Leave the test?","Your test in progress will be lost.",function(ok){ if(ok) startMode(m); });
      return;
    }
    startMode(m);
  };
});
window.addEventListener("beforeunload",function(e){
  if(leavingTest()){ e.preventDefault(); e.returnValue=""; return ""; }
});
$("#btnResetProgress").onclick=function(){
  confirmBox("Reset progress?","Your missed states, streak, and scores will be cleared.",function(ok){
    if(!ok) return;
    prog={missed:[],bestStreak:0,bestScore:0,tests:0,practice:{missedOnly:false}};
    save();
    startMode(mode);
  });
};

/* ---- magnifier lens ---- */
let lensOn=false, lensPaths=null, lensVB={x:0,y:0,w:80,h:60}, lensQueued=null, lensRAF=0;
function buildLens(){
  const g=$("#lensInner");
  while(g.firstChild) g.removeChild(g.firstChild);
  const clone=gStates.cloneNode(true);
  clone.removeAttribute("id");
  lensPaths={};
  $$("path",clone).forEach(function(p){
    const ab=p.getAttribute("data-ab");
    p.removeAttribute("id");
    lensPaths[ab]=p;
  });
  g.appendChild(clone);
  syncLens();
}
function syncLens(){
  if(!lensPaths) return;
  order.forEach(function(ab){ if(lensPaths[ab]) lensPaths[ab].setAttribute("class",cls[ab]||""); });
}
function moveLens(x,y){
  lensQueued={x:x,y:y};
  if(lensRAF) return;
  lensRAF=requestAnimationFrame(function(){
    lensRAF=0;
    if(!lensQueued) return;
    lensVB.x=lensQueued.x-40;
    lensVB.y=lensQueued.y-30;
    $("#lens").setAttribute("viewBox",lensVB.x.toFixed(2)+" "+lensVB.y.toFixed(2)+" "+lensVB.w+" "+lensVB.h);
  });
}
$("#btnLens").onclick=function(){
  lensOn=!lensOn;
  this.classList.toggle("on",lensOn);
  $("#lensWrap").classList.toggle("hide",!lensOn);
  if(lensOn&&!lensPaths) buildLens();
  if(!lensOn) lensQueued=null;
};
$("#lens").addEventListener("pointerdown",function(e){
  e.preventDefault();
  const r=this.getBoundingClientRect();
  const x=lensVB.x+(e.clientX-r.left)/r.width*lensVB.w;
  const y=lensVB.y+(e.clientY-r.top)/r.height*lensVB.h;
  handlePoint(x,y,null);
});

/* ---- zoom buttons ---- */
function neView(){
  const ne=["RI","MA","CT","NJ","DE","VT","NH","MD"];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ne.forEach(function(ab){
    const b=els[ab].getBBox();
    x0=Math.min(x0,b.x); y0=Math.min(y0,b.y);
    x1=Math.max(x1,b.x+b.width); y1=Math.max(y1,b.y+b.height);
  });
  const pad=30, ar=vb.w/vb.h;
  let w=(x1-x0)+pad*2, h=(y1-y0)+pad*2;
  if(h*ar>w) w=h*ar; else h=w/ar;
  return {x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w:w,h:h};
}
$("#btnNE").onclick=function(){ tweenTo(neView()); };
$("#btnReset").onclick=function(){ tweenTo({x:0,y:0,w:MAP_W,h:MAP_H}); };
$("#btnIn").onclick=function(){ const c={x:vb.x+vb.w/2,y:vb.y+vb.h/2}; zoomAt(c.x,c.y,1/1.45); };
$("#btnOut").onclick=function(){ const c={x:vb.x+vb.w/2,y:vb.y+vb.h/2}; zoomAt(c.x,c.y,1.45); };
svg.addEventListener("wheel",function(e){
  e.preventDefault();
  const p=svgPoint(e);
  zoomAt(p.x,p.y,e.deltaY>0?1.18:1/1.18);
},{passive:false});

/* ---- pointer handling: pan, pinch, select ---- */
const ptrs=new Map();
let dragged=false, downInfo=null;
svg.addEventListener("pointerdown",function(e){
  try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  const p=svgPoint(e);
  ptrs.set(e.pointerId,p);
  if(ptrs.size===1){
    dragged=false;
    downInfo={x:e.clientX,y:e.clientY,vb:{x:vb.x,y:vb.y}};
    if(mode==="study"){ hideTip(); }
  }
});
svg.addEventListener("pointermove",function(e){
  const p=svgPoint(e);
  if(lensOn) moveLens(p.x,p.y);
  if(ptrs.has(e.pointerId)){
    const prev=ptrs.get(e.pointerId);
    ptrs.set(e.pointerId,p);
    if(downInfo&&Math.abs(e.clientX-downInfo.x)+Math.abs(e.clientY-downInfo.y)>6) dragged=true;
    if(ptrs.size===2){
      const a=Array.from(ptrs.values());
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      const mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
      if(vb.pinchDist) zoomAt(mx,my,vb.pinchDist/d);
      vb.pinchDist=d;
    } else {
      vb.x=downInfo.vb.x+(prev.x-p.x);
      vb.y=downInfo.vb.y+(prev.y-p.y);
      applyVB();
    }
    return;
  }
  if(mode!=="study") return;
  const ab=abFromEvent(e)||stateAtPoint(p.x,p.y);
  if(ab!==studyHover){
    studyHover=ab;
    if(cls.hl){ delete cls.hl; paint(); }
    if(ab&&studyView==="none"){ cls.hl="hl"; paint(); }
  }
  if(ab){
    tipFor(ab,p.x,p.y);
    if(studyView==="none") showOneCapital(ab);
  } else {
    hideTip();
    if(studyView==="none") clearGroup(gCaps);
  }
});
function endPointer(e){
  const had=ptrs.has(e.pointerId);
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) vb.pinchDist=0;
  if(!had) return;
  const p=svgPoint(e);
  const ab=abFromEvent(e)||stateAtPoint(p.x,p.y);
  if(!dragged) handlePoint(p.x,p.y,ab);
  if(ptrs.size===0) downInfo=null;
}
svg.addEventListener("pointerup",endPointer);
svg.addEventListener("pointercancel",function(e){ ptrs.delete(e.pointerId); vb.pinchDist=0; downInfo=null; });
svg.addEventListener("pointerleave",function(){
  if(mode==="study"){
    studyHover=null;
    if(cls.hl){ delete cls.hl; paint(); }
    hideTip();
    if(studyView==="none") clearGroup(gCaps);
  }
});
function handlePoint(x,y,preAb){
  const ab=preAb||stateAtPoint(x,y);
  if(!ab||!byAbbr[ab]) return;
  if(mode==="study"){ focusState(ab); return; }
  if(mode==="practice"){
    if(pr&&pr.placing) practiceClick(x,y);
    return;
  }
  if(mode==="test"){
    if(!test||test.submitted) return;
    if(test.pool.indexOf(ab)<0){
      confirmBox("Not part of this test",byAbbr[ab].name+" is not on this test's list.",function(){});
      return;
    }
    if(test.armed&&test.sel){
      test.ans[test.sel].dot={x:x,y:y};
      test.armed=false;
      svg.style.cursor="crosshair";
      redrawDots();
      openCard(test.sel);
      buildPills();
      return;
    }
    selectState(ab);
  }
}

applyVB();
startMode("study");
</script>
